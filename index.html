<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ulta Beauty – Password Reset Countdown</title>
<style>
  /* ---------- Tokens: dark by default, light overrides ---------- */
  :root {
    --pink:        #FF4F8B;
    --pink-band:   #C40D4E;
    --orange:      #F47E3B;   /* Ulta logo orange */
    --orange-cta:  #F26A2E;   /* Culture Snap pill orange */
    --surface:     #2B1420;
    --surface-2:   #3A1A2A;
    --text:        #FFE9EF;
    --text-soft:   #F3BCCB;
    --on-band:     #FFFFFF;
    --ok:          #34C77B;
    --warn:        #FFB800;
    --bad:         #FF3B5C;
    --focus:       #FFFFFF;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --pink:       #E30F5A;
      --pink-band:  #E30F5A;
      --surface:    #FCDDE3;
      --surface-2:  #F9CCD6;
      --text:       #4A1028;
      --text-soft:  #8A3A57;
      --ok:         #1F9D55;
      --warn:       #F2A900;
      --bad:        #E4002B;
      --focus:      #4A1028;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, system-ui, sans-serif;
    display: flex; justify-content: center;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Frame ---------- */
  .frame {
    width: 100%;
    max-width: 520px;
    aspect-ratio: 4 / 3;
    container-type: size;
    background: var(--surface);
    color: var(--text);
    border-radius: 16px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto auto;
    grid-template-areas: "top" "head" "count" "band";
  }

  /* Landscape: headline and count share a row */
  .frame[data-ratio="landscape"] {
    grid-template-columns: 1.15fr 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "top top" "head count" "band band";
  }

  .top   { grid-area: top; }
  .head  { grid-area: head; }
  .count { grid-area: count; }
  .band  { grid-area: band; }

  /* One scale unit per frame, so every ratio stays proportional */
  .frame { --u: 1cqmin; --pad: calc(var(--u) * 5); }
  .frame[data-ratio="landscape"] { --u: 1.05cqmin; }
  .frame[data-ratio="portrait"]  { --u: 1.25cqmin; }

  /* ---------- Top row ---------- */
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: var(--pad) var(--pad) 0;
  }
  .logo { height: calc(var(--u) * 12); width: auto; display: block; }
  .hello {
    font-size: calc(var(--u) * 3.6);
    color: var(--text-soft);
    font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 55%;
  }

  /* ---------- Headline ---------- */
  .head {
    padding: calc(var(--u) * 2.5) var(--pad) 0;
    display: flex; flex-direction: column; justify-content: center;
    min-height: 0;
  }
  .title {
    font-weight: 900;
    color: var(--pink);
    text-transform: uppercase;
    letter-spacing: -0.01em;
    line-height: 0.92;
    font-size: min(calc(var(--u) * 11), 8.6cqw);
  }
  .frame[data-ratio="landscape"] .title { font-size: min(calc(var(--u) * 11), 5.6cqw); }
  .subtitle {
    font-weight: 800;
    font-style: italic;
    color: var(--orange-cta);
    font-size: min(calc(var(--u) * 8), 7cqw);
    line-height: 1;
    margin-top: calc(var(--u) * 1);
    transform: rotate(-3deg);
    transform-origin: left center;
  }
  .frame[data-ratio="landscape"] .subtitle { font-size: min(calc(var(--u) * 8), 4.4cqw); }

  /* ---------- Countdown ---------- */
  .count {
    padding: calc(var(--u) * 3) var(--pad);
    display: flex; align-items: center; gap: calc(var(--u) * 4);
  }
  .frame[data-ratio="landscape"] .count { padding-top: calc(var(--u) * 2.5); padding-left: 0; }

  .bubble { flex: none; width: calc(var(--u) * 20); height: auto; }
  .num-wrap { display: flex; flex-direction: column; min-width: 0; }
  .num-line { display: flex; align-items: baseline; gap: calc(var(--u) * 2); }
  .num {
    font-weight: 900;
    font-size: calc(var(--u) * 22);
    line-height: 0.85;
    color: var(--pink);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
  }
  .unit {
    font-weight: 800;
    font-size: calc(var(--u) * 6.5);
    color: var(--pink);
  }
  .caption {
    font-size: calc(var(--u) * 3.8);
    font-weight: 600;
    color: var(--text);
    margin-top: calc(var(--u) * 1.6);
    line-height: 1.25;
  }
  .date {
    font-size: calc(var(--u) * 3.4);
    color: var(--text-soft);
    margin-top: calc(var(--u) * 0.6);
  }

  /* ---------- Band (Culture Snap magenta strip) ---------- */
  .band {
    background: var(--pink-band);
    color: var(--on-band);
    padding: calc(var(--u) * 3.5) var(--pad);
    display: flex; align-items: center; justify-content: space-between;
    gap: calc(var(--u) * 3);
  }
  .frame[data-ratio="portrait"] .band,
  .frame[data-ratio="square"] .band {
    flex-direction: column; align-items: stretch; text-align: center;
  }
  .status {
    display: flex; align-items: center; gap: calc(var(--u) * 2);
    font-weight: 700;
    font-size: calc(var(--u) * 3.8);
    line-height: 1.2;
    min-width: 0;
  }
  .frame[data-ratio="portrait"] .status,
  .frame[data-ratio="square"] .status { justify-content: center; }

  /* Status dot: coloured core on a white disc so it reads on the magenta band */
  .dot {
    flex: none; position: relative;
    width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4);
    border-radius: 50%;
    background: #FFFFFF;
  }
  .dot::after {
    content: ""; position: absolute; inset: 22%;
    border-radius: 50%;
    background: var(--ok);
    animation: status 2s ease-in-out infinite;
  }
  .frame[data-state="warn"] .dot::after { background: var(--warn); }
  .frame[data-state="bad"] .dot::after,
  .frame[data-state="today"] .dot::after,
  .frame[data-state="expired"] .dot::after { background: var(--bad); animation: none; }
  .frame[data-state="bad"] .dot { animation: pulse 1.5s ease-in-out infinite; }

  @keyframes status { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,255,255,0.85); }
    70%  { box-shadow: 0 0 0 calc(var(--u) * 3) rgba(255,255,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
  }

  .cta {
    flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--orange-cta);
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 800;
    font-size: calc(var(--u) * 3.9);
    padding: calc(var(--u) * 2.6) calc(var(--u) * 5);
    border-radius: 999px;
    white-space: nowrap;
    box-shadow: 0 calc(var(--u) * 0.6) 0 rgba(0,0,0,0.18);
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  .cta:hover { transform: translateY(-1px); }
  .cta:active { transform: translateY(1px); box-shadow: 0 0 0 rgba(0,0,0,0); }
  .cta:focus-visible { outline: 3px solid var(--on-band); outline-offset: 3px; }
  .cta[aria-disabled="true"] { cursor: not-allowed; }

  /* Portrait: spread blocks evenly instead of one large gap */
  .frame[data-ratio="portrait"] {
    grid-template-rows: auto auto auto auto;
    align-content: space-between;
  }

  /* Narrow screens: tighten copy */
  @container (max-width: 360px) {
    .frame[data-ratio="landscape"] .caption { display: none; }
  }
  /* Very small landscape tiles: drop decoration, scale type up */
  @media (max-width: 380px) {
    .frame[data-ratio="landscape"] { --u: 1.45cqmin; }
    .frame[data-ratio="landscape"] .bubble,
    .frame[data-ratio="landscape"] .date,
    .frame[data-ratio="landscape"] .hello { display: none; }
    .frame[data-ratio="landscape"] .title { font-size: 7cqw; }
    .frame[data-ratio="landscape"] .subtitle { font-size: 5.4cqw; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dot, .dot::after { animation: none !important; }
    .cta { transition: none; }
  }
</style>
</head>

    <span class="hello" id="hello"></span>
  </div>

  <div class="head">
    <h1 class="title">Password reset</h1>
    <p class="subtitle" id="subtitle">is coming up!</p>
  </div>

  <div class="count">
    <!-- Speech-bubble lock mark, drawn to match the Culture Snap icon language -->
    <svg class="bubble" viewBox="0 0 100 112" aria-hidden="true">
      <g stroke="var(--pink)" stroke-width="5" stroke-linecap="round">
        <line x1="50" y1="4"  x2="50" y2="15"/>
        <line x1="30" y1="9"  x2="36" y2="18"/>
        <line x1="70" y1="9"  x2="64" y2="18"/>
      </g>
      <path d="M10 30 h80 a8 8 0 0 1 8 8 v46 a8 8 0 0 1 -8 8 h-30 l-14 16 v-16 h-36 a8 8 0 0 1 -8 -8 v-46 a8 8 0 0 1 8 -8z"
            fill="var(--orange-cta)" stroke="#fff" stroke-width="3"/>
      <rect x="20" y="38" width="60" height="44" rx="6" fill="var(--pink)" stroke="#fff" stroke-width="2.5"/>
      <path d="M40 58 v-6 a10 10 0 0 1 20 0 v6" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
      <rect x="35" y="57" width="30" height="20" rx="4" fill="#fff"/>
      <circle cx="50" cy="65" r="3.2" fill="var(--pink)"/>
      <rect x="48.6" y="66" width="2.8" height="6" rx="1.4" fill="var(--pink)"/>
    </svg>
    <div class="num-wrap">
      <div class="num-line">
        <span class="num" id="num">–</span>
        <span class="unit" id="unit">days</span>
      </div>
      <p class="caption" id="caption">until your SSO password expires</p>
      <p class="date" id="date"></p>
    </div>
  </div>

  <div class="band">
    <p class="status"><span class="dot" aria-hidden="true"></span><span id="status">Time to reset soon!</span></p>
    <a class="cta" id="cta" href="#" role="button">Click here to reset password</a>
  </div>

</main>

<script>
(function () {
  'use strict';

  /* ---------- 1. Ingest: WorkJam standard set + custom ---------- */
  const params = new URLSearchParams(window.location.search);

  const vars = {
    // Location
    externalLocationId:   params.get('externalLocationId')   || null,
    externalLocationCode: params.get('externalLocationCode') || null,
    address:              params.get('address')              || null,
    city:                 params.get('city')                 || null,
    stateOrProvince:      params.get('stateOrProvince')      || null,
    country:              params.get('country')              || null,
    zipCode:              params.get('zipCode')              || null,
    // Region
    externalRegionId:     params.get('externalRegionId')     || null,
    externalRegionCode:   params.get('externalRegionCode')   || null,
    // Employee
    employeeId:           params.get('employeeId')           || null,
    employeeCode:         params.get('employeeCode')         || null,
    username:             params.get('username')             || null,
    language:             params.get('language')             || 'en',
    // Display
    aspectRatio:          params.get('aspectRatio')          || 'standard',
    // Custom (Ulta Beauty build)
    passwordExpiryDate:   params.get('passwordExpiryDate')   || null,  // ISO date: last day the password works
    daysUntilExpiry:      params.get('daysUntilExpiry')      || null,  // number; 1 = expires today
    resetUrl:             params.get('resetUrl')             || null,  // SSO reset link (integration)
    resetTarget:          params.get('resetTarget')          || '_blank'
  };
  window.widgetVars = vars; // exposed for integration debugging

  /* ---------- 2. Aspect ratio ---------- */
  const RATIOS = { standard: '4 / 3', square: '1 / 1', landscape: '16 / 9', portrait: '9 / 16' };
  const frame = document.getElementById('frame');
  const ratioKey = RATIOS[vars.aspectRatio] ? vars.aspectRatio : 'standard';
  frame.style.aspectRatio = RATIOS[ratioKey];
  frame.dataset.ratio = ratioKey;

  /* ---------- 3. Deterministic fallback (seeded by employeeId) ---------- */
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  const seedKey = vars.employeeId || 'ulta-default';
  const fallbackDays = 1 + (hash(seedKey) % 14); // stable 1–14 per employee

  /* ---------- 4. Resolve the expiry date (local calendar day) ---------- */
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function parseIsoDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return isNaN(d) ? null : d;
  }

  // The expiry date is the LAST day the password works.
  // "Days left" counts today, so on the expiry date itself it reads 1 ("expires today").
  let expiryDay = parseIsoDate(vars.passwordExpiryDate);
  let source = 'passwordExpiryDate';
  if (!expiryDay) {
    const n = parseInt(vars.daysUntilExpiry, 10);
    const days = Number.isFinite(n) ? n : fallbackDays;
    source = Number.isFinite(n) ? 'daysUntilExpiry' : 'fallback';
    const today = startOfDay(new Date());
    expiryDay = new Date(today.getFullYear(), today.getMonth(), today.getDate() + days - 1);
  }

  function daysLeft() {
    const today = startOfDay(new Date());
    const diff = Math.round((expiryDay - today) / 86400000);
    return diff + 1;
  }

  /* ---------- 5. Status states ---------- */
  function stateFor(d) {
    if (d <= 0) return { key: 'expired', sub: 'is overdue!',      msg: 'Your password has expired. Reset now!' };
    if (d === 1) return { key: 'today',  sub: 'is due today!',    msg: 'Your password expires today!' };
    if (d <= 3)  return { key: 'bad',    sub: 'is almost here!',  msg: 'Your password is about to expire. Reset now!' };
    if (d <= 6)  return { key: 'warn',   sub: 'is coming fast!',  msg: "Don’t get locked out, reset now!" };
    return         { key: 'ok',     sub: 'is coming up!',    msg: 'Time to reset soon!' };
  }

  /* ---------- 6. Render ---------- */
  const el = {
    num: document.getElementById('num'),
    unit: document.getElementById('unit'),
    caption: document.getElementById('caption'),
    date: document.getElementById('date'),
    status: document.getElementById('status'),
    subtitle: document.getElementById('subtitle'),
    hello: document.getElementById('hello'),
    cta: document.getElementById('cta')
  };

  if (vars.username) el.hello.textContent = 'Hi ' + vars.username + '!';

  const fmtDate = new Intl.DateTimeFormat(vars.language || 'en', { weekday: 'short', month: 'short', day: 'numeric' });

  let lastShown = null;
  function render(animate) {
    const d = daysLeft();
    if (d === lastShown) return;
    lastShown = d;
    const s = stateFor(d);
    frame.dataset.state = s.key;
    el.subtitle.textContent = s.sub;
    el.status.textContent = s.msg;

    if (d <= 0) {
      el.num.textContent = '0';
      el.unit.textContent = 'days';
      el.caption.textContent = 'Your SSO password has expired';
      el.date.textContent = 'Expired ' + fmtDate.format(expiryDay);
    } else {
      el.unit.textContent = d === 1 ? 'day' : 'days';
      el.caption.textContent = d === 1 ? 'left on your SSO password' : 'until your SSO password expires';
      el.date.textContent = (d === 1 ? 'Last day: ' : 'Last day to reset: ') + fmtDate.format(expiryDay);
      if (animate) countIn(d); else el.num.textContent = String(d);
    }
  }

  // One orchestrated moment: the number counts down into place on load.
  function countIn(target) {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const from = Math.min(target + 9, 30);
    if (reduce || from === target) { el.num.textContent = String(target); return; }
    const start = performance.now(), dur = 700;
    (function step(t) {
      const p = Math.min(1, (t - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.num.textContent = String(Math.round(from - (from - target) * eased));
      if (p < 1) requestAnimationFrame(step);
    })(start);
  }

  /* ---------- 7. Reset button (integration hook) ---------- */
  function safeUrl(u) {
    try {
      const url = new URL(u, window.location.href);
      return (url.protocol === 'https:' || url.protocol === 'http:') ? url.href : null;
    } catch (e) { return null; }
  }
  const resetHref = vars.resetUrl ? safeUrl(vars.resetUrl) : null;
  const target = ['_blank', '_top', '_self', '_parent'].includes(vars.resetTarget) ? vars.resetTarget : '_blank';
  if (resetHref) {
    el.cta.href = resetHref;
    el.cta.target = target;
    if (target === '_blank') el.cta.rel = 'noopener noreferrer';
    el.cta.removeAttribute('role');
  } else {
    el.cta.setAttribute('aria-disabled', 'true');
    el.cta.title = 'Reset link not configured yet';
    el.cta.addEventListener('click', function (e) { e.preventDefault(); });
  }
  // Integration hook: lets the host page listen for clicks if it wires SSO itself
  el.cta.addEventListener('click', function () {
    try {
      window.parent && window.parent.postMessage({ type: 'ulta-password-reset-click', daysLeft: daysLeft() }, '*');
    } catch (e) {}
  });

  /* ---------- 8. Tick: check every second, re-render only when the day changes ---------- */
  render(true);
  setInterval(function () { render(false); }, 1000);
  window.__widgetDebug = { source: source, fallbackDays: fallbackDays, expiryDay: expiryDay };
})();
</script>
